<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Himachal Pradesh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F7F7F7;
            color: #222222;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 20px;
            border-bottom: 1px solid #DDDDDD;
        }
        .navbar-logo a {
            text-decoration: none;
            color: #484848;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }
        .navbar-menu a {
            text-decoration: none;
            color: #484848;
            font-weight: 600;
        }
        .btn-primary {
            background-color: #FF385C;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #E32E59;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 100px 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .main-header {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: bold;
            color: #FF385C;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding: 40px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-8px);
        }
        .card-image {
            width: 100%;
            object-fit: cover;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 8px;
        }
        .footer {
            text-align: center;
            padding: 40px;
            background-color: #ffffff;
            border-top: 1px solid #DDDDDD;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <a href="#">Explore Himachal Pradesh</a>
        </div>
        <ul class="navbar-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#category-cards">Tourist Places</a></li>
            <li><a class="btn-primary" href="#">Plan Your Trip</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1 class="main-header">Explore Himachal Pradesh</h1>
        <p>Discover serene valleys, adventure, and majestic mountains</p>
    </section>

    <section class="cards-grid">
        <div class="card">
            <img class="card-image" src="https://images.unsplash.com/photo-1596017259353-5a6f71dfb3de" alt="Tourist Places">
            <h3 class="card-title">Tourist Places</h3>
        </div>
        <div class="card">
            <img class="card-image" src="https://images.unsplash.com/photo-1514994667786-37242b0507ea" alt="Adventure Activities">
            <h3 class="card-title">Adventure Activities</h3>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Explore Himachal Pradesh. All rights reserved.</p>
    </footer>
</body>
</html>

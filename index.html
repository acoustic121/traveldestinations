<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Destinations</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Multiple CSS styles, such as variables, animations, and section designs */
        /* Truncated content */
    </style>
</head>
<body>
    <!-- ============================================
         HERO SECTION
         ============================================ -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <h1 class="main-header">Travel Destinations</h1>
            <p class="subtitle">Discover India</p>
        </div>
        <div class="scroll-indicator">
            <span>Scroll</span>
            <div class="mouse"></div>
        </div>
    </section>

    <section class="destinations-section">
        <div class="section-header">
            <span class="section-label">Explore India</span>
            <h2 class="section-title">Choose your destination</h2>
        </div>
        <div class="cards-grid">
            <!-- Card 1: Himachal Pradesh -->
            <a href="himachal.html" class="travel-card" aria-label="Explore Himachal Pradesh">
                <img 
                    src="https://images.unsplash.com/photo-1657894736581-ccc35d62d9e2?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?auto[...]" 
                    alt="Mountains of Himachal Pradesh" 
                    class="card-image"
                    loading="lazy"
                >
                <div class="card-overlay"></div>
                <div class="card-glass">
                    <span class="card-location">Northern India</span>
                    <h3 class="card-title">Himachal Pradesh</h3>
                    <p class="card-description">
                        Experience the breathtaking Himalayan landscapes, ancient temples, and thrilling adventure sports in the lap of nature.
                    </p>
                    <button class="explore-btn" aria-hidden="true">
                        Explore Now
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                        </svg>
                    </button>
                </div>
            </a>

            <!-- Other destination cards can follow here -->
        </div>
    </section>

    <footer class="footer">
        <p class="footer-text">Designed with ♥ for Travelers</p>
    </footer>
</body>
</html>
